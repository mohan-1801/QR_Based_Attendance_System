{% extends 'base.html' %}

{% block title %}Reset Password - Smart QR System{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card card-custom p-4 shadow-lg border-0">
            <h4 class="fw-bold text-primary mb-2">Forgot Password?</h4>
            <p class="text-secondary small mb-4">Enter your registered email address below and we will send password reset instructions.</p>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email Address</label>
                    {{ form.email }}
                </div>
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg fw-semibold">Send Reset Instructions</button>
                    <a href="{% url 'accounts:login' %}" class="btn btn-link text-decoration-none text-secondary">Back to Login</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
