{% extends 'base.html' %}

{% block title %}Generate QR Code - Smart QR System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="card card-custom p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="rounded-3 bg-primary text-white p-3 d-flex align-items-center justify-content-center" style="width: 54px; height: 54px;">
                    <i class="bi bi-qr-code fs-2"></i>
                </div>
                <div>
                    <h3 class="fw-bold m-0">Generate Attendance QR Code</h3>
                    <p class="text-secondary small m-0">Select class details and expiration timer to launch session</p>
                </div>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Subject *</label>
                        <select name="subject" class="form-select form-select-lg" required>
                            {% for sub in subjects %}
                                <option value="{{ sub.id }}">{{ sub.code }} - {{ sub.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Section *</label>
                        <select name="section" class="form-select form-select-lg" required>
                            {% for sec in sections %}
                                <option value="{{ sec.id }}">{{ sec.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Department *</label>
                        <select name="department" class="form-select form-select-lg" required>
                            {% for d in departments %}
                                <option value="{{ d.id }}">{{ d.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Semester *</label>
                        <select name="semester" class="form-select form-select-lg" required>
                            {% for sem in semesters %}
                                <option value="{{ sem.id }}">{{ sem.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Time Slot</label>
                        <input type="text" name="time_slot" class="form-control form-select-lg" value="09:00 AM - 10:00 AM">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Configurable Validity (Minutes)</label>
                        <select name="duration_minutes" class="form-select form-select-lg">
                            <option value="2">2 Minutes</option>
                            <option value="3" selected>3 Minutes (Recommended)</option>
                            <option value="5">5 Minutes</option>
                            <option value="10">10 Minutes</option>
                        </select>
                    </div>
                </div>

                <div class="mt-4 pt-3 border-top d-flex justify-content-end gap-3">
                    <a href="{% url 'dashboard:dashboard' %}" class="btn btn-outline-secondary btn-lg">Cancel</a>
                    <button type="submit" class="btn btn-primary btn-lg px-5 fw-semibold shadow">
                        <i class="bi bi-play-circle me-2"></i>Generate Live QR Code
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
